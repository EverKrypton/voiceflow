<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VoiceFlow — Telegram voice messages, reimagined</title>
<style>
  :root {
    --chat-bg: #17212B;
    --header-bg: #17212B;
    --bubble-in: #212F3E;
    --bubble-out: #2B5278;
    --accent: #5EB5F7;
    --text: #FFFFFF;
    --text-2: #7F91A4;
    --wave-idle: #4A6377;
    --wave-played: #5EB5F7;
    --line: rgba(255,255,255,.08);
    --rec: #FF4E4E;
  }
  html[data-theme="light"] {
    --chat-bg: #FFFFFF;
    --header-bg: #FFFFFF;
    --bubble-in: #F1F1F1;
    --bubble-out: #EFFDDE;
    --accent: #3390EC;
    --text: #000000;
    --text-2: #707579;
    --wave-idle: #B7C3CC;
    --wave-played: #3390EC;
    --line: rgba(0,0,0,.07);
    --rec: #FF3B30;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    background:
      radial-gradient(1200px 600px at 20% -10%, #1d2a3a 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #14202c 0%, transparent 55%),
      #0d151d;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8eef4;
    padding: 24px;
  }

  /* ---------- phone ---------- */
  .phone {
    position: relative;
    width: 390px; height: 844px;
    max-height: calc(100vh - 96px);
    background: var(--chat-bg);
    border-radius: 48px;
    box-shadow:
      0 0 0 10px #05090d,
      0 0 0 12px #1c2733,
      0 40px 90px rgba(0,0,0,.65);
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: background .4s ease;
  }
  .notch {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; border-radius: 16px; background: #05090d; z-index: 20;
  }
  .statusbar {
    height: 54px; flex: 0 0 auto;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 26px 6px; font-size: 13px; font-weight: 600;
    color: var(--text); position: relative; z-index: 15;
  }
  .statusbar .right { display: flex; gap: 5px; align-items: center; opacity: .9; }

  .chat-header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 8px 14px 12px; background: var(--header-bg);
    border-bottom: 1px solid var(--line); position: relative; z-index: 10;
  }
  .chat-header .back { color: var(--accent); font-size: 20px; opacity: .9; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(140deg, #5EB5F7, #6C7BFF 60%, #B46CF7);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px;
    box-shadow: 0 4px 12px rgba(94,181,247,.35);
  }
  .chat-header .meta { line-height: 1.15; }
  .chat-header .name { color: var(--text); font-weight: 600; font-size: 16px; }
  .chat-header .sub { color: var(--text-2); font-size: 12.5px; }
  .chat-header .tools { margin-left: auto; color: var(--text-2); font-size: 18px; letter-spacing: 2px; }

  .chat {
    flex: 1 1 auto; overflow-y: auto; padding: 16px 14px 8px;
    display: flex; flex-direction: column; gap: 10px;
    scrollbar-width: none;
  }
  .chat::-webkit-scrollbar { display: none; }

  .msg { max-width: 84%; font-size: 15px; line-height: 1.35; position: relative; }
  .msg.in {
    align-self: flex-start; background: var(--bubble-in); color: var(--text);
    padding: 8px 12px; border-radius: 16px 16px 16px 6px;
  }
  .bubble-out { align-self: flex-end; width: 100%; display: flex; flex-direction: column; align-items: flex-end; }

  /* ---------- voice message ---------- */
  .voice {
    width: 100%;
    background: var(--bubble-out); color: var(--text);
    border-radius: 18px 18px 6px 18px;
    padding: 10px 12px 10px 10px;
    display: flex; align-items: center; gap: 10px;
    position: relative;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
    touch-action: none;
    transition: transform .3s cubic-bezier(.22,1,.36,1);
  }
  .playbtn {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
    background: var(--accent); color: #fff; border: 0; cursor: pointer;
    display: grid; place-items: center; padding: 0;
    transition: transform .18s cubic-bezier(.22,1,.36,1), filter .18s;
  }
  .playbtn:active { transform: scale(.9); }
  .playbtn svg { width: 16px; height: 16px; }
  .wave-wrap { position: relative; flex: 1 1 auto; height: 46px; }
  canvas.wave { display: block; width: 100%; height: 46px; }
  .dur { flex: 0 0 auto; font-size: 12px; color: rgba(255,255,255,.85); min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
  html[data-theme="light"] .dur { color: var(--text-2); }

  /* speed chip + pill */
  .speed-chip {
    position: absolute; top: 8px; right: 12px;
    font-size: 11px; font-weight: 700; color: rgba(255,255,255,.9);
    background: rgba(0,0,0,.22); border: 0; border-radius: 9px;
    padding: 2px 7px; cursor: pointer; z-index: 5;
    font-variant-numeric: tabular-nums;
  }
  html[data-theme="light"] .speed-chip { color: var(--accent); background: rgba(0,0,0,.06); }
  .speed-pill {
    position: absolute; top: -6px; right: 8px;
    display: flex; flex-direction: column; gap: 2px;
    background: rgba(20,28,38,.94); border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px; padding: 5px; z-index: 30;
    backdrop-filter: blur(14px);
    transform: translateY(6px) scale(.9); opacity: 0; pointer-events: none;
    transition: transform .38s cubic-bezier(.34,1.56,.64,1), opacity .22s ease;
    transform-origin: bottom right;
  }
  .speed-pill.open { transform: translateY(-44px) scale(1); opacity: 1; pointer-events: auto; }
  .speed-pill button {
    border: 0; background: transparent; color: #cfe0ee; font-size: 12px; font-weight: 600;
    padding: 5px 12px; border-radius: 9px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .speed-pill button:hover { background: rgba(255,255,255,.08); }
  .speed-pill button.on { background: var(--accent); color: #fff; }

  /* transcript */
  .transcript {
    margin-top: 7px; padding: 0 4px;
    font-size: 13.5px; line-height: 1.75; color: var(--text-2);
    max-width: 100%; align-self: flex-end; text-align: right;
    opacity: 0; transform: translateY(-4px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .transcript.show { opacity: 1; transform: none; }
  .transcript .w { transition: background-color .15s ease, color .15s ease; border-radius: 6px; padding: 1px 3px; }
  .transcript .w.active { background: var(--accent); color: #fff; }

  /* ---------- input bar ---------- */
  .inputbar {
    flex: 0 0 auto; display: flex; align-items: flex-end; gap: 10px;
    padding: 10px 12px 26px; background: var(--header-bg);
    border-top: 1px solid var(--line);
  }
  .field {
    flex: 1 1 auto; min-height: 42px; border-radius: 22px; background: var(--bubble-in);
    color: var(--text-2); display: flex; align-items: center; padding: 0 16px; font-size: 15px;
    border: 1px solid var(--line);
  }
  .mic {
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; display: grid; place-items: center;
    transition: transform .18s cubic-bezier(.22,1,.36,1), background .3s;
    position: relative;
  }
  .mic:active { transform: scale(.92); }
  .mic.recording { background: var(--rec); }
  .mic.recording::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 2px solid var(--rec); animation: pulsering 1.2s ease-in-out infinite;
  }
  @keyframes pulsering {
    0%,100% { transform: scale(1); opacity: .55; }
    50%     { transform: scale(1.14); opacity: 0; }
  }
  .mic svg { width: 20px; height: 20px; }

  /* rec state banner */
  .recing {
    align-self: flex-end; width: 100%; display: none;
    background: var(--bubble-out); border-radius: 18px; padding: 10px 12px;
    align-items: center; gap: 10px;
  }
  .recing .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); animation: blink 1s steps(2,end) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .recing .t { font-size: 12px; color: rgba(255,255,255,.9); font-variant-numeric: tabular-nums; min-width: 34px; }
  .recing .hint { margin-left: auto; font-size: 12px; color: rgba(255,255,255,.6); }

  /* ---------- demo controls ---------- */
  .controls {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
    max-width: 520px;
  }
  .controls button {
    background: rgba(255,255,255,.06); color: #cfe0ee; border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px; padding: 8px 15px; font-size: 13px; cursor: pointer;
    transition: background .18s, transform .18s;
  }
  .controls button:hover { background: rgba(255,255,255,.12); }
  .controls button:active { transform: scale(.96); }
  .controls .primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  .controls .note { font-size: 12px; color: #6f8399; width: 100%; text-align: center; }
  .brand { font-size: 12px; color: #6f8399; letter-spacing: .3px; }
  .brand b { color: #9fb3c6; }

  /* ---------- reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .mic.recording::after { animation: none; opacity: .4; transform: none; }
    .recing .dot { animation: none; opacity: .8; }
    .speed-pill { transition: none; }
    .voice, .playbtn, .mic { transition: none; }
    .transcript .w { transition: none; }
  }
</style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="notch"></div>
    <div class="statusbar">
      <span>9:41</span>
      <span class="right">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 9.2l-1.8-1.8a2.5 2.5 0 013.6 0L8 9.2zM8 5.3c-1.3 0-2.5.5-3.4 1.3l1.1 1.1A3.4 3.4 0 018 6.9c.9 0 1.7.3 2.3.9l1.1-1.1A5 5 0 008 5.3zM8 1.6c-2.3 0-4.4.9-6 2.4l1.1 1.1A7 7 0 018 3.2c1.7 0 3.3.7 4.5 1.9l1.1-1.1A8.5 8.5 0 008 1.6z"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="19" height="10" rx="3" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="15" height="7" rx="1.6" fill="currentColor"/><rect x="21" y="3.5" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
      </span>
    </div>

    <div class="chat-header">
      <span class="back">‹</span>
      <div class="avatar">VF</div>
      <div class="meta">
        <div class="name">VoiceFlow</div>
        <div class="sub" id="sub">design concept · by @ograinhard</div>
      </div>
      <div class="tools">⋮</div>
    </div>

    <div class="chat" id="chat">
      <div class="msg in">Voice notes should be as readable as they are speakable. Try it 👇</div>

      <!-- recording state bubble -->
      <div class="recing" id="recing">
        <span class="dot"></span>
        <span class="t" id="recTime">0:00</span>
        <div class="wave-wrap" style="flex:1"><canvas class="wave" id="recCanvas"></canvas></div>
        <span class="hint">tap ■ to send</span>
      </div>
    </div>

    <div class="inputbar">
      <div class="field">Message</div>
      <button class="mic" id="mic" aria-label="Record voice message">
        <svg id="micIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z"/><path d="M19 11a1 1 0 10-2 0 5 5 0 01-10 0 1 1 0 10-2 0 7 7 0 006 6.92V20H8.5a1 1 0 100 2h7a1 1 0 100-2H13v-2.08A7 7 0 0019 11z"/></svg>
      </button>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="simulate">▶ Simulate recording</button>
    <button id="theme">◐ Theme</button>
    <button id="reset">⟲ Reset</button>
    <div class="note">VoiceFlow · a Telegram design concept · <b>@ograinhard</b> · real Web Audio, no dependencies</div>
  </div>

<script>
(() => {
  "use strict";

  const BAR_COUNT = 48;
  const BAR_GAP = 2;
  const ACCENT = () => getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  const IDLE   = () => getComputedStyle(document.documentElement).getPropertyValue("--wave-idle").trim();

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const $ = (id) => document.getElementById(id);
  const chat = $("chat");
  const recing = $("recing");
  const recCanvas = $("recCanvas");
  const recTime = $("recTime");
  const mic = $("mic");
  const micIcon = $("micIcon");

  const MIC_SVG = micIcon.innerHTML;
  const STOP_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';

  let audioCtx = null;
  let analyser = null, srcNode = null, mediaStream = null, recorder = null;
  let recChunks = [], recording = false, recStart = 0;
  let livePeaks = new Array(BAR_COUNT).fill(0);
  let smoothed = new Array(BAR_COUNT).fill(0);
  let level = 0, rafId = null, barTimer = null;

  let msg = null;           // active voice message object
  let audioEl = null;
  let playRaf = null;

  /* ---------------- WAV encode (for simulated audio) ---------------- */
  function encodeWav(samples, sampleRate) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
    w(0, "RIFF"); view.setUint32(4, 36 + samples.length * 2, true); w(8, "WAVE");
    w(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
    view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    w(36, "data"); view.setUint32(40, samples.length * 2, true);
    let o = 44;
    for (let i = 0; i < samples.length; i++) { const s = Math.max(-1, Math.min(1, samples[i])); view.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true); o += 2; }
    return new Blob([view], { type: "audio/wav" });
  }

  /* synthetic voice-ish signal so the demo works without a microphone */
  function synthesize(seconds = 5.2, sr = 44100) {
    const n = Math.floor(seconds * sr);
    const out = new Float32Array(n);
    let seed = 1234; const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    const syllables = [];
    let t = 0.15;
    while (t < seconds - 0.15) {
      const dur = 0.14 + rnd() * 0.16;
      syllables.push({ t, dur, f: 110 + rnd() * 90, g: 0.5 + rnd() * 0.5 });
      t += dur + 0.03 + rnd() * 0.06;
    }
    for (let i = 0; i < n; i++) {
      const time = i / sr;
      let s = 0;
      for (const sy of syllables) {
        if (time < sy.t || time > sy.t + sy.dur) continue;
        const p = (time - sy.t) / sy.dur;
        const env = Math.sin(Math.PI * p) ** 1.4;
        const vib = 1 + 0.02 * Math.sin(2 * Math.PI * 5 * time);
        s += env * sy.g * (
          0.6 * Math.sin(2 * Math.PI * sy.f * vib * time) +
          0.3 * Math.sin(2 * Math.PI * sy.f * 2 * vib * time) +
          0.15 * Math.sin(2 * Math.PI * sy.f * 3 * vib * time)
        );
      }
      s += (rnd() - 0.5) * 0.02;
      out[i] = Math.max(-1, Math.min(1, s * 0.7));
    }
    return out;
  }

  /* downsample raw PCM into BAR_COUNT peak bars */
  function peaksFromSamples(samples, bars = BAR_COUNT) {
    const block = Math.floor(samples.length / bars) || 1;
    const peaks = [];
    let max = 1e-6;
    for (let b = 0; b < bars; b++) {
      let peak = 0;
      const start = b * block, end = Math.min(samples.length, start + block);
      for (let i = start; i < end; i++) peak = Math.max(peak, Math.abs(samples[i]));
      peaks.push(peak); max = Math.max(max, peak);
    }
    return peaks.map((p) => Math.max(0.06, p / max));
  }

  async function peaksFromBlob(blob) {
    const ac = audioCtx || (audioCtx = new (window.AudioContext || window.webkitAudioContext)());
    const arr = await blob.arrayBuffer();
    const audio = await ac.decodeAudioData(arr);
    const data = audio.getChannelData(0);
    return { peaks: peaksFromSamples(data), duration: audio.duration };
  }

  /* ---------------- drawing ---------------- */
  function fitCanvas(c) {
    const dpr = window.devicePixelRatio || 1;
    const r = c.getBoundingClientRect();
    if (c.width !== Math.round(r.width * dpr) || c.height !== Math.round(r.height * dpr)) {
      c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
    }
    const ctx = c.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w: r.width, h: r.height };
  }

  function drawBars(c, peaks, progress, opts = {}) {
    const { ctx, w, h } = fitCanvas(c);
    ctx.clearRect(0, 0, w, h);
    const n = peaks.length;
    const bw = Math.max(1.4, (w - (n - 1) * BAR_GAP) / n);
    const mid = h / 2;
    const minH = 2;
    const playedColor = ACCENT();
    const idleColor = opts.recording ? ACCENT() : IDLE();
    for (let i = 0; i < n; i++) {
      const x = i * (bw + BAR_GAP);
      const amp = Math.max(0, Math.min(1, peaks[i] || 0));
      const bh = Math.max(minH, amp * (h - 4));
      const y = mid - bh / 2;
      const played = progress != null && (i / n) < progress;
      ctx.fillStyle = played ? playedColor : idleColor;
      if (!played && !opts.recording) ctx.globalAlpha = 0.85; else ctx.globalAlpha = 1;
      const r = Math.min(bw / 2, 2.4);
      roundRect(ctx, x, y, bw, bh, r);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (progress != null && progress > 0 && progress < 1) {
      const px = progress * w;
      ctx.fillStyle = playedColor;
      ctx.fillRect(px - 0.75, 2, 1.5, h - 4);
    }
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ---------------- recording ---------------- */
  async function startRecording() {
    if (recording) return stopRecording();
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      alert("Microphone unavailable. Use “Simulate recording” to see VoiceFlow.");
      return;
    }
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    srcNode = audioCtx.createMediaStreamSource(mediaStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    srcNode.connect(analyser);

    recChunks = [];
    try {
      recorder = new MediaRecorder(mediaStream);
      recorder.ondataavailable = (e) => e.data.size && recChunks.push(e.data);
      recorder.start();
    } catch (e) { recorder = null; }

    recording = true;
    recStart = performance.now();
    livePeaks = new Array(BAR_COUNT).fill(0);
    smoothed = new Array(BAR_COUNT).fill(0);
    chat.style.display = "flex";
    recing.style.display = "flex";
    recing.style.alignSelf = "flex-end";
    mic.classList.add("recording");
    micIcon.innerHTML = STOP_SVG;

    const data = new Uint8Array(analyser.fftSize);
    const tick = () => {
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
      level = Math.sqrt(sum / data.length);
      for (let i = 0; i < BAR_COUNT; i++) {
        const target = livePeaks[i] || 0;
        smoothed[i] += (target - smoothed[i]) * (target > smoothed[i] ? 0.5 : 0.12);
      }
      drawBars(recCanvas, smoothed, null, { recording: true });
      recTime.textContent = fmt((performance.now() - recStart) / 1000);
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);

    barTimer = setInterval(() => {
      livePeaks.push(Math.max(0.05, Math.min(1, level * 3.2)));
      livePeaks.shift();
    }, 90);
  }

  async function stopRecording() {
    recording = false;
    cancelAnimationFrame(rafId); clearInterval(barTimer);
    mic.classList.remove("recording");
    micIcon.innerHTML = MIC_SVG;
    recing.style.display = "none";

    const duration = (performance.now() - recStart) / 1000;
    let blob = null, peaks = null;
    if (recorder && recorder.state !== "inactive") {
      blob = await new Promise((res) => { recorder.onstop = () => res(new Blob(recChunks, { type: recorder.mimeType })); recorder.stop(); });
      try { const r = await peaksFromBlob(blob); peaks = r.peaks; } catch (e) { peaks = null; }
    }
    mediaStream && mediaStream.getTracks().forEach((t) => t.stop());

    const finalPeaks = peaks || peaksFromSamples(synthesize(Math.max(1, duration || 3)));
    const url = blob ? URL.createObjectURL(blob) : null;
    sendVoiceMessage({ url, peaks: finalPeaks, duration: Math.max(0.6, duration) });
  }

  function fallbackPeaks() {
    const p = [];
    for (let i = 0; i < BAR_COUNT; i++) p.push(0.25 + 0.6 * Math.abs(Math.sin(i * 0.7)));
    return p;
  }

  /* ---------------- send + build message ---------------- */
  function sendVoiceMessage({ url, peaks, duration }) {
    if (msg) msg.el.remove();
    const wrap = document.createElement("div");
    wrap.className = "bubble-out";
    wrap.innerHTML = `
      <div class="voice" role="group" aria-label="Voice message, ${fmt(duration)}">
        <button class="playbtn" aria-label="Play"></button>
        <div class="wave-wrap"><canvas class="wave" aria-hidden="true"></canvas></div>
        <span class="dur">${fmt(duration)}</span>
        <button class="speed-chip" aria-label="Playback speed">1×</button>
        <div class="speed-pill" role="menu">
          ${[0.5, 1, 1.5, 2].map((s) => `<button role="menuitem" data-s="${s}" class="${s === 1 ? "on" : ""}">${s}×</button>`).join("")}
        </div>
      </div>
      <div class="transcript"></div>`;
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;

    const el = wrap.querySelector(".voice");
    const canvas = wrap.querySelector("canvas.wave");
    const playbtn = wrap.querySelector(".playbtn");
    const dur = wrap.querySelector(".dur");
    const chip = wrap.querySelector(".speed-chip");
    const pill = wrap.querySelector(".speed-pill");
    const transcriptEl = wrap.querySelector(".transcript");

    msg = { el: wrap, voice: el, canvas, peaks, duration, url, speed: 1, playing: false, progress: 0 };

    playbtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 001.5.86l11-6.86a1 1 0 000-1.72l-11-6.86A1 1 0 008 5.14z"/></svg>';

    if (url) {
      audioEl = new Audio(url);
      audioEl.playbackRate = 1;
      audioEl.addEventListener("ended", () => { stopPlayback(); msg.progress = 0; renderMessage(); updatePlayIcon(); });
    } else {
      audioEl = null;
    }

    buildTranscript(transcriptEl, duration);
    requestAnimationFrame(() => { transcriptEl.classList.add("show"); renderMessage(); });

    playbtn.addEventListener("click", togglePlay);
    attachScrub(canvas);
    chip.addEventListener("click", (e) => { e.stopPropagation(); pill.classList.toggle("open"); });
    pill.querySelectorAll("button").forEach((b) => b.addEventListener("click", (e) => {
      e.stopPropagation();
      setSpeed(parseFloat(b.dataset.s), pill, chip);
    }));
    attachSpeedGesture(el, pill, chip);
    updatePlayIcon();
  }

  function fmt(s) { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

  function renderMessage() {
    if (!msg) return;
    drawBars(msg.canvas, msg.peaks, msg.playing || msg.progress > 0 ? msg.progress : 0);
    msg.el.querySelector(".dur").textContent = fmt(msg.duration);
  }

  function updatePlayIcon() {
    if (!msg) return;
    msg.el.querySelector(".playbtn").innerHTML = msg.playing
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 001.5.86l11-6.86a1 1 0 000-1.72l-11-6.86A1 1 0 008 5.14z"/></svg>';
  }

  /* ---------------- playback ---------------- */
  let virtualClock = 0, virtualRaf = null, lastTs = 0;
  function togglePlay() {
    if (!msg) return;
    if (msg.playing) { stopPlayback(); }
    else { startPlayback(); }
  }
  function startPlayback() {
    msg.playing = true; updatePlayIcon();
    if (audioEl) {
      audioEl.playbackRate = msg.speed;
      audioEl.currentTime = msg.progress * msg.duration;
      audioEl.play();
    }
    lastTs = performance.now();
    const loop = () => {
      if (!msg.playing) return;
      if (audioEl) {
        msg.progress = audioEl.duration ? audioEl.currentTime / audioEl.duration : 0;
      } else {
        const now = performance.now();
        virtualClock += (now - lastTs) / 1000 * msg.speed; lastTs = now;
        msg.progress = Math.min(1, virtualClock / msg.duration);
        if (msg.progress >= 1) { stopPlayback(); msg.progress = 0; renderMessage(); return; }
      }
      renderMessage(); syncTranscript(msg.progress * msg.duration);
      playRaf = requestAnimationFrame(loop);
    };
    playRaf = requestAnimationFrame(loop);
  }
  function stopPlayback() {
    msg.playing = false; cancelAnimationFrame(playRaf);
    if (audioEl) { audioEl.pause(); virtualClock = msg.progress * msg.duration; }
    updatePlayIcon(); renderMessage();
  }

  function setSpeed(s, pill, chip) {
    msg.speed = s;
    if (audioEl) audioEl.playbackRate = s;
    chip.textContent = s + "×";
    pill.querySelectorAll("button").forEach((b) => b.classList.toggle("on", parseFloat(b.dataset.s) === s));
    pill.classList.remove("open");
  }

  /* ---------------- scrub ---------------- */
  function attachScrub(canvas) {
    let dragging = false, lastTick = 0;
    const seek = (e) => {
      const r = canvas.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      msg.progress = ratio;
      const t = ratio * msg.duration;
      if (audioEl) { audioEl.currentTime = t; virtualClock = t; }
      else virtualClock = t;
      if (navigator.vibrate && Math.abs(t - lastTick) > 0.1) { navigator.vibrate(6); lastTick = t; }
      renderMessage(); syncTranscript(t);
    };
    canvas.addEventListener("pointerdown", (e) => { dragging = true; canvas.setPointerCapture(e.pointerId); seek(e); });
    canvas.addEventListener("pointermove", (e) => { if (dragging) seek(e); });
    canvas.addEventListener("pointerup", (e) => { dragging = false; canvas.releasePointerCapture(e.pointerId); });
    canvas.addEventListener("pointercancel", () => { dragging = false; });
  }

  /* ---------------- speed swipe gesture ---------------- */
  function attachSpeedGesture(el, pill, chip) {
    let y0 = null;
    el.addEventListener("pointerdown", (e) => { if (!e.target.closest("button")) y0 = e.clientY; });
    el.addEventListener("pointerup", (e) => {
      if (y0 == null) return;
      const dy = e.clientY - y0; y0 = null;
      if (dy < -28) pill.classList.add("open");
      else if (dy > 28) pill.classList.remove("open");
    });
  }

  /* ---------------- transcript ---------------- */
  const PHRASE = "Hey, just recorded this with VoiceFlow — drag anywhere on the waveform to scrub, and swipe up for playback speed.";
  let transcriptWords = [];
  function buildTranscript(el, duration) {
    const words = PHRASE.split(" ");
    const totalChars = words.reduce((a, w) => a + w.length + 1, 0);
    let t = 0; el.innerHTML = ""; transcriptWords = [];
    words.forEach((w) => {
      const span = (w.length + 1) / totalChars * duration;
      const node = document.createElement("span");
      node.className = "w"; node.textContent = w;
      el.appendChild(node); el.appendChild(document.createTextNode(" "));
      transcriptWords.push({ node, start: t, end: t + span });
      t += span;
    });
  }
  function syncTranscript(time) {
    if (!msg) return;
    let active = null;
    for (const w of transcriptWords) {
      const on = time >= w.start && time < w.end;
      w.node.classList.toggle("active", on);
      if (on) active = w;
    }
    if (active && !reduceMotion) active.node.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  /* ---------------- simulate ---------------- */
  async function simulate() {
    if (recording) return;
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const samples = synthesize();
    const blob = encodeWav(samples, audioCtx.sampleRate);
    const duration = samples.length / audioCtx.sampleRate;
    const peaks = peaksFromSamples(samples);

    recording = true;
    recStart = performance.now();
    livePeaks = new Array(BAR_COUNT).fill(0);
    smoothed = new Array(BAR_COUNT).fill(0);
    recing.style.display = "flex";
    recing.style.alignSelf = "flex-end";
    mic.classList.add("recording");
    micIcon.innerHTML = STOP_SVG;

    const data = new Float32Array(samples);
    const blockSamples = Math.floor(samples.length / BAR_COUNT);
    const startOffset = performance.now();
    const tick = () => {
      if (!recording) return;
      const elapsed = (performance.now() - startOffset) / 1000;
      const upto = Math.min(BAR_COUNT, Math.floor(elapsed / duration * BAR_COUNT) + 1);
      for (let i = 0; i < upto; i++) {
        let peak = 0;
        for (let j = i * blockSamples; j < (i + 1) * blockSamples; j++) peak = Math.max(peak, Math.abs(data[j]));
        livePeaks[i] = Math.max(0.06, peak);
        smoothed[i] += (livePeaks[i] - smoothed[i]) * (livePeaks[i] > smoothed[i] ? 0.5 : 0.12);
      }
      drawBars(recCanvas, smoothed, null, { recording: true });
      recTime.textContent = fmt(elapsed);
      if (elapsed >= duration) { recording = false; finishSimulate(blob, peaks, duration); return; }
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
  }

  function finishSimulate(blob, peaks, duration) {
    mic.classList.remove("recording");
    micIcon.innerHTML = MIC_SVG;
    recing.style.display = "none";
    sendVoiceMessage({ url: URL.createObjectURL(blob), peaks, duration });
  }

  /* ---------------- events ---------------- */
  mic.addEventListener("click", () => {
    if (recording) stopRecording(); else startRecording();
  });
  $("simulate").addEventListener("click", simulate);
  $("theme").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    document.documentElement.setAttribute("data-theme", cur === "light" ? "dark" : "light");
    if (msg) renderMessage();
  });
  $("reset").addEventListener("click", () => {
    if (recording) { recording = false; cancelAnimationFrame(rafId); clearInterval(barTimer); mic.classList.remove("recording"); micIcon.innerHTML = MIC_SVG; recing.style.display = "none"; mediaStream && mediaStream.getTracks().forEach((t) => t.stop()); }
    stopPlayback();
    if (msg) { msg.el.remove(); msg = null; }
    audioEl = null; transcriptWords = [];
    Array.from(chat.querySelectorAll(".bubble-out")).forEach((n) => n.remove());
  });
  window.addEventListener("resize", () => { if (msg) renderMessage(); });

  /* expose for the demo script / console */
  window.VoiceFlow = { simulate, reset: $("reset").click.bind($("reset")) };
})();
</script>
</body>
</html>
